[package]
name = "cinnamon"
version = "0.1.0"
edition = "2021"
description = "SigmaOS SigmaOS-cinnamon component - Desktop and productivity"
license = "MIT"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-cinnamon"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
